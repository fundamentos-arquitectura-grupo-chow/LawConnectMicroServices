spring.application.name=iam-service

server.port=8001

spring.datasource.url=jdbc:postgresql://profiles-service-db:5432/profiles_database
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=0


spring.jpa.hibernate.naming.physical-strategy=org.lorem.shared.domain.model.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy