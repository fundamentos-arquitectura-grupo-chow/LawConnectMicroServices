syntax = "proto3";

option java_multiple_files = true;
package profile;

service ProfileService {
  rpc CreateClient (ClientRequest) returns (EmptyResponse);
  rpc CreateLawyer (LawyerRequest) returns (EmptyResponse);
}

message ClientRequest {
  string firstName = 1;
  string lastName = 2;
  string email = 3;
  string phoneNumber = 4;
  string address = 5;
  string dni = 6;
  string image_url = 7;
}

message LawyerRequest {
  string firstName = 1;
  string lastName = 2;
  string email = 3;
  string phoneNumber = 4;
  string address = 5;
  string dni = 6;
  string image_url = 7;
}

message EmptyResponse {}
