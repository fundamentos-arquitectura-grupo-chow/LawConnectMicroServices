syntax = "proto3";

option java_multiple_files = true;
package communication;

service CommunicationService {
  rpc CreateChatRoom (CreateChatRoomRequest) returns (ChatRoomResponse);
  rpc GetChatRoomById (GetChatRoomRequest) returns (ChatRoomResponse);
  rpc SendMessage (SendMessageRequest) returns (MessageResponse);
  rpc GetMessagesByRoomId (GetMessagesRequest) returns (MessagesListResponse);
}

message CreateChatRoomRequest {
  int64 consultation_id = 1;
  int64 lawyer_id = 2;
  int64 client_id = 3;
}

message GetChatRoomRequest {
  int64 chat_room_id = 1;
}

message ChatRoomResponse {
  int64 id = 1;
  int64 consultation_id = 2;
  int64 lawyer_id = 3;
  int64 client_id = 4;
  string created_at = 5;
}

message SendMessageRequest {
  int64 chat_room_id = 1;
  int64 sender_id = 2;
  string content = 3;
}

message MessageResponse {
  int64 id = 1;
  int64 chat_room_id = 2;
  int64 sender_id = 3;
  string content = 4;
  string sent_at = 5;
}

message GetMessagesRequest {
  int64 chat_room_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message MessagesListResponse {
  repeated MessageResponse messages = 1;
}