syntax = "proto3";

option java_multiple_files = true;
package iam;

service IAMService {
  rpc GetUserIdByUsername (GetUserIdRequest) returns (GetUserIdResponse);
  rpc GetUsernameByUserId (GetUsernameRequest) returns (GetUsernameResponse);
}

message GetUserIdRequest {
  string username = 1;
}

message GetUserIdResponse {
  int64 userId = 1;
}

message GetUsernameRequest {
  int64 userId = 1;
}

message GetUsernameResponse {
  string username = 1;
}