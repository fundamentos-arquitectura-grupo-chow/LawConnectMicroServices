    networks:
      - lawconnect-network
    restart: on-failure

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway-container
    ports:
      - "8000:8000"
      - "6570:6565"
    networks:
      - lawconnect-network
    depends_on:
      iam-service:
        condition: service_started
      follow-up-service:
        condition: service_started
      consultation-service:
        condition: service_started
      profiles-service:
        condition: service_started

networks:
  lawconnect-network:
    driver: bridge
