version: '3.9'

services:
  iam-service-db:
    image: postgres:15
    container_name: iam-service-db-container
    environment:
      POSTGRES_DB: iam_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iam_database"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lawconnect-network

  iam-service:
    build:
      context: ../iam-service
      dockerfile: Dockerfile
    container_name: iam-service-container
    environment:
      AUTHORIZATION_JWT_SECRET: clave_secreta_para_firmar_jwt_tokens
      AUTHORIZATION_JWT_EXPIRATION_DAYS: 7
      SPRING_DATASOURCE_URL: jdbc:postgresql://iam-service-db:5432/iam_database
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_APPLICATION_JSON: '{
        "spring.main.allow-circular-references": true,
        "spring.jpa.show-sql": true,
        "spring.jpa.hibernate.ddl-auto": "update",
        "spring.jpa.open-in-view": true,
        "spring.servlet.multipart.enabled": true
      }'
    ports:
      - "8001:8001"
      - "6566:6565"
    depends_on:
      iam-service-db:
        condition: service_healthy
    networks:
      - lawconnect-network
    restart: on-failure

  follow-up-service-db:
    image: postgres:15
    container_name: follow-up-service-db-container
    environment:
      POSTGRES_DB: follow_up_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d follow_up_database"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
