server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                          allowedOrigins:
                            - "*"
                          allowedMethods:
                            - GET
                            - POST
                            - PUT
                            - DELETE
                          allowedHeaders:
                            - "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure: all
  metrics:
    enable:
      all: true

security:
  basic:
    enabled: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 50
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 1s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 1s
    instances:
      user-service:
        baseConfig: default
      order-service:
        baseConfig: default
      product-service:
        baseConfig: default

logging:
  level:
    org.springframework.cloud.gateway: DEBUG