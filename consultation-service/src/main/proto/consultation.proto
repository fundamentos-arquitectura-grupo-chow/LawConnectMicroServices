syntax = "proto3";

option java_multiple_files = true;
package consultation;

service ConsultationService {
  rpc GetConsultationId (GetConsultationIdRequest) returns (ConsultationIdResponse);
}

message GetConsultationIdRequest {
  int64 consultationId = 1;
}

message ConsultationIdResponse {
  int64 consultationId = 1;
}
